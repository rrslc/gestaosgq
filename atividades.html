<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SGQ · Atividades — Garantia da Qualidade</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>

  <!-- ═══ Portal de Login ═══════════════════════════════════════════════════ -->
  <div id="login-screen">
    <div class="login-card">
      <div class="login-brand">
        <div class="login-logo-mark">m<span>S</span>b<sup>®</sup></div>
        <div class="login-logo-sub">Medical System do Brasil</div>
      </div>
      <div class="login-eyebrow">Atividades da Garantia da Qualidade</div>
      <div id="login-hint"></div>
      <form id="login-form" autocomplete="off">
        <div class="login-field">
          <label for="login-nome">Colaborador(a)</label>
          <select id="login-nome" required></select>
        </div>
        <div class="login-field">
          <label for="login-senha" id="login-senha-label">Senha</label>
          <input type="password" id="login-senha" required autocomplete="current-password">
        </div>
        <div id="login-error"></div>
        <button type="submit" id="login-submit" class="btn btn-primary">Entrar</button>
      </form>
      <div class="login-footer">
        <span id="login-mode"></span>
      </div>
    </div>
  </div>

  <!-- ═══ Sidebar ═══════════════════════════════════════════════════════════ -->
  <aside id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-title">SGQ</div>
      <div class="logo-sub">Dispositivos Médicos</div>
    </div>

    <!-- Menu gerado por JS a partir de js/menu.js, conforme o app ativo. -->
    <nav></nav>
  </aside>

  <!-- ═══ Main ══════════════════════════════════════════════════════════════ -->
  <main id="main">

    <!-- Topbar -->
    <div id="topbar">
      <span id="topbar-title">Atividades</span>
      <span id="topbar-date"></span>
      <span id="topbar-mode" title="Modo de armazenamento" style="font-size:0.75rem;color:var(--muted)"></span>
      <div class="topbar-actions">
        <div id="topbar-session"></div>
        <button class="btn btn-secondary btn-sm" id="btn-import" title="Importar backup JSON">⬆ Importar</button>
        <button class="btn btn-secondary btn-sm" id="btn-export" title="Exportar backup JSON">⬇ Exportar</button>
      </div>
    </div>

    <!-- Content -->
    <div id="content"></div>

  </main>

  <script>window.__APP__ = 'gq';</script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
